<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Pig Agent 控制台</title>
    <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<header>
    <h1>🐷 Pig Agent 控制台</h1>
    <span id="conn" class="conn off">离线</span>
</header>

<main>
    <section class="panel" id="agents-panel">
        <div class="panel-head">
            <h2>Agents</h2>
            <button id="refresh">刷新</button>
        </div>
        <ul id="agents" class="agents"></ul>

        <form id="create-form" class="create">
            <input name="id" placeholder="id" required/>
            <input name="name" placeholder="名称" required/>
            <input name="modelId" placeholder="modelId（可选）"/>
            <button type="submit">新建</button>
        </form>
    </section>

    <section class="panel" id="events-panel">
        <div class="panel-head">
            <h2>实时事件</h2>
            <button id="clear-events">清空</button>
        </div>
        <ul id="events" class="events"></ul>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
